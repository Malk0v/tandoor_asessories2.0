<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tandoor accessories</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Аксесуари до тандиру</h1>
      </div>

      <div class="controls">
        <input id="search-input" type="search" placeholder="Пошук товарів..." />
        <select id="category-select">
          <option value="all">Всі категорії</option>
        </select>
      </div>

      <div class="cart-control">
        <button id="cart-btn">🛒 <span id="cart-count">0</span></button>
      </div>
    </header>

    <main>
      <div id="product-list" class="grid"></div>
    </main>

    <div id="cart-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Корзина</h2>
        <div id="cart-items"></div>
        <p id="cart-total"></p>
        <button id="send-order" class="btn">Оформити замовлення</button>
        <button id="close-cart" class="btn">Закрити</button>
      </div>
    </div>

    <!-- синхронные данные -->
    <script src="data/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/telegram.js"></script>
  </body>
</html>
