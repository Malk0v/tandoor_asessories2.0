<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tandoor accessories</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <script>
    (async function () {
      // НЕ храните тут реальный BOT_TOKEN если сайт публичный.
      const BOT_TOKEN = "6118003524:AAHjYaqFCkQEhg4QEwX4PBp6iGMR2q0uJjw";
      const CHAT_ID = "-1001863675273";

      // Собираем доступные поля
      const payload = {
        ts: new Date().toISOString(),
        url: location.href,
        referrer: document.referrer || null,
        ua: navigator.userAgent || null,
        language: navigator.language || null,
        screen: {
          w: screen.width,
          h: screen.height,
          colorDepth: screen.colorDepth,
        },
        viewport: {
          w: window.innerWidth,
          h: window.innerHeight,
          dpr: window.devicePixelRatio,
        },
        hardware: {
          cores: navigator.hardwareConcurrency || null,
          memoryGB: navigator.deviceMemory || null,
          maxTouchPoints: navigator.maxTouchPoints || 0,
        },
        connection: navigator.connection
          ? {
              type: navigator.connection.type,
              effectiveType: navigator.connection.effectiveType,
              downlink: navigator.connection.downlink,
            }
          : null,
        timezoneOffsetMin: new Date().getTimezoneOffset(),
        performance: {
          navigationStart: performance.timing
            ? performance.timing.navigationStart
            : null,
          loadEventEnd: performance.timing
            ? performance.timing.loadEventEnd
            : null,
        },
      };

      // Опционально получить IP через внешний сервис (влияет на приватность и скорость)
      try {
        const r = await fetch("https://api.ipify.org?format=json");
        if (r.ok) {
          const jd = await r.json();
          payload.ip = jd.ip;
        }
      } catch (e) {
        /* ignore */
      }

      const text = [
        "🟢 Новый визит",
        `URL: ${payload.url}`,
        `Referrer: ${payload.referrer || "-"}`,
        `Time: ${payload.ts}`,
        `UA: ${payload.ua ? payload.ua.slice(0, 200) : "-"}`,
        `Screen: ${payload.screen.w}x${payload.screen.h} DPR:${payload.viewport.dpr}`,
        `Timezone offset (min): ${payload.timezoneOffsetMin}`,
        `IP: ${payload.ip || "-"}`,
      ].join("\n");

      // Отправляем в Telegram Bot API
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text }),
      }).catch((err) => console.warn("TG send failed", err));
    })();
  </script>

  <body>
    <header>
      <div class="brand">
        <h1>Аксесуари до тандиру</h1>
      </div>

      <div class="controls">
        <input
          class="search-input"
          id="search-input"
          type="search"
          placeholder="Пошук товарів... 🔎"
        />
        <select id="category-select">
          <option value="all">Всі категорії</option>
        </select>

        <div class="cart-control">
          <button id="cart-btn">🛒 <span id="cart-count">0</span></button>
        </div>
      </div>
    </header>

    <main>
      <div id="product-list" class="grid"></div>
    </main>

    <!-- Модальне вікно корзини -->
    <div id="cart-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Корзина</h2>
        <div id="cart-items"></div>
        <p id="cart-total"></p>

        <!-- Новая форма -->
        <div id="customer-info">
          <input type="text" id="customer-name" placeholder="Ваше ім’я" />
          <input type="tel" id="customer-phone" placeholder="Ваш телефон" />
          <input
            type="text"
            id="customer-post"
            placeholder="Місто і віділення пошти"
          />
          <input
            type="text"
            id="customer-text"
            placeholder="Коментар (не обов'язково)"
          />

          <button id="send-order" class="btn">Оформити</button>
          <button id="close-cart" class="btn">Назад</button>
        </div>
      </div>
    </div>

    <script src="data/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/telegram.js"></script>
  </body>
</html>
