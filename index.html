<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optic Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Optic Store</h1>
    <button id="cart-btn">🛒 <span id="cart-count">0</span></button>
  </header>

  <main id="product-list" class="grid"></main>

  <div id="cart-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Корзина</h2>
      <div id="cart-items"></div>
      <p id="cart-total"></p>
      <button id="send-order">Оформити замовлення</button>
      <button id="close-cart">Закрити</button>
    </div>
  </div>

  <!-- products are loaded synchronously from data/products.js -->
  <script src="data/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/telegram.js"></script>
</body>
</html>
